name: D1 migration validation

on:
  pull_request:
    paths:
      - "d1/**"
      - "prisma/schema.prisma"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/d1-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run db:d1:sync-schema
      - run: git diff --exit-code -- d1/schema.prisma d1/contract.json
      - run: npm run db:d1:generate
      - run: npm run db:d1:validate
      - run: npm run db:d1:migrate:local
      - run: npm run db:d1:build
      - run: npm run db:d1:typecheck
      - run: npm run db:d1:smoke
